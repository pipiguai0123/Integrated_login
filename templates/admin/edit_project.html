{% extends 'base.html' %}

{% block title %}编辑项目 - 集成系统管理平台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>编辑项目</h2>
    <a href="{{ url_for('admin.projects') }}" class="btn btn-secondary">返回项目列表</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_project', id=project.id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">项目名称</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ project.name }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">项目描述</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ project.description }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">关联平台</label>
                <div class="border p-3 rounded">
                    {% for platform in platforms %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="platforms" value="{{ platform.id }}" id="platform-{{ platform.id }}" {% if platform.id in project_platforms %}checked{% endif %}>
                        <label class="form-check-label" for="platform-{{ platform.id }}">
                            {{ platform.name }} - {{ platform.url }}
                        </label>
                    </div>
                    {% else %}
                    <p class="text-muted mb-0">暂无平台，请先添加平台</p>
                    {% endfor %}
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">更新项目</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
