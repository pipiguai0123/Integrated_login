{% extends 'base.html' %}

{% block title %}编辑平台 - 集成系统管理平台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>编辑平台</h2>
    <a href="{{ url_for('admin.platforms') }}" class="btn btn-secondary">返回平台列表</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_platform', id=platform.id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">平台名称</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ platform.name }}" required>
            </div>
            <div class="mb-3">
                <label for="url" class="form-label">平台URL（外网访问）</label>
                <input type="url" class="form-control" id="url" name="url" value="{{ platform.url }}">
                <div class="form-text">请输入完整的URL，包括http://或https://，用于直接访问（外网URL和内网URL至少填写一个）</div>
            </div>
            <div class="mb-3">
                <label for="internal_url" class="form-label">内网URL（优先访问）</label>
                <input type="url" class="form-control" id="internal_url" name="internal_url" value="{{ platform.internal_url }}">
                <div class="form-text">可选。如果平台有内网地址，请在此输入。系统将优先使用此地址访问平台。</div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">平台描述</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ platform.description }}</textarea>
            </div>
            <div class="mb-3">
                <label for="weight" class="form-label">排序权重</label>
                <input type="number" class="form-control" id="weight" name="weight" value="{{ platform.weight }}" min="0">
                <div class="form-text">数值越大，在平台列表中排序越靠前（默认为0）</div>
            </div>

            <hr>
            <h5 class="mb-3">平台登录信息</h5>

            <div class="card mb-3">
                <div class="card-header bg-light">
                    <h6 class="mb-0">项目账号</h6>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="project_username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="project_username" name="project_username" value="{{ platform.project_username }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="project_password" class="form-label">密码</label>
                                <input type="text" class="form-control" id="project_password" name="project_password" value="{{ platform.project_password }}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header bg-light">
                    <h6 class="mb-0">超管账号</h6>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="admin_username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="admin_username" name="admin_username" value="{{ platform.admin_username }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="admin_password" class="form-label">密码</label>
                                <input type="text" class="form-control" id="admin_password" name="admin_password" value="{{ platform.admin_password }}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">更新平台</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
