{% extends 'base.html' %}

{% block title %}编辑用户 - 集成系统管理平台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>编辑用户</h2>
    <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">返回用户列表</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.edit_user', id=user.id) }}">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="留空表示不修改密码">
                <div class="form-text">如果不需要修改密码，请留空</div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="is_admin" name="is_admin" {% if user.is_admin %}checked{% endif %}>
                <label class="form-check-label" for="is_admin">管理员权限</label>
            </div>
            <div class="mb-3">
                <label class="form-label">所属项目</label>
                <div class="border p-3 rounded">
                    {% for project in projects %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="projects" value="{{ project.id }}" id="project-{{ project.id }}" {% if project.id in user_projects %}checked{% endif %}>
                        <label class="form-check-label" for="project-{{ project.id }}">
                            {{ project.name }}
                        </label>
                    </div>
                    {% else %}
                    <p class="text-muted mb-0">暂无项目</p>
                    {% endfor %}
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">更新用户</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
