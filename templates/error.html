{% extends 'base.html' %}

{% block title %}错误 - 集成系统管理平台{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">发生错误</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-danger">
                    <h5>{{ error }}</h5>
                    <p>抱歉，系统遇到了一个错误。请稍后再试或联系管理员。</p>
                </div>
                <div class="text-center mt-4">
                    <a href="{{ url_for('index') }}" class="btn btn-primary">返回首页</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
